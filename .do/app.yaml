# DigitalOcean App Platform spec for the entry page.
# Apply changes with: doctl --context block52 apps update <app-id> --spec .do/app.yaml
name: sweepstake
region: syd
static_sites:
  - name: web
    git:
      repo_clone_url: https://github.com/bitcoinbrisbane/SweepStake.nft.git
      branch: sweep-tiers-nft-entry-page
    source_dir: web
    environment_slug: node-js
    build_command: yarn build
    output_dir: dist
    envs:
      # The deployed contract. If this changes, apply the spec and force a rebuild.
      - key: VITE_SWEEP_ADDRESS
        scope: BUILD_TIME
        value: "0x5a5f04760A99F0792C0a3ff0B5A14890c7292f07"
      # The test contract on Sepolia, used when the URL has ?testnet=true.
      - key: VITE_TESTNET_SWEEP_ADDRESS
        scope: BUILD_TIME
        value: "0x7c054427A4f0264Db51E9B8eAbfd2221B995dC20"
      # From dashboard.reown.com. It's public, and it adds WalletConnect for phone wallets.
      - key: VITE_WALLETCONNECT_PROJECT_ID
        scope: BUILD_TIME
        value: "170f4fcaa020f3a6158f396730426926"
      # mainnet, base, base-sepolia or sepolia.
      - key: VITE_CHAIN
        scope: BUILD_TIME
        value: mainnet
