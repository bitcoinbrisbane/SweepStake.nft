# DigitalOcean App Platform spec for the entry page.
# Apply changes with: doctl --context block52 apps update <app-id> --spec .do/app.yaml
name: sweepstake
region: syd
static_sites:
  - name: web
    git:
      repo_clone_url: https://github.com/bitcoinbrisbane/SweepStake.nft.git
      branch: sweep-tiers-nft-entry-page
    source_dir: web
    environment_slug: node-js
    build_command: yarn build
    output_dir: dist
    envs:
      # The deployed contract. Empty until the replacement goes in, and the page says the sweep isn't open.
      # If this changes, apply the spec so the page rebuilds.
      - key: VITE_SWEEP_ADDRESS
        scope: BUILD_TIME
        value: ""
      # The test contract on Sepolia, used when the URL has ?testnet=true.
      - key: VITE_TESTNET_SWEEP_ADDRESS
        scope: BUILD_TIME
        value: "0x6E6eCbEC6106d31b340a2Bea1c124b9b2f377bb6"
      # mainnet, base or base-sepolia.
      - key: VITE_CHAIN
        scope: BUILD_TIME
        value: mainnet
